# Quant Research + Risk Validation Agent configuration
# ---------------------------------------------------------------
# All model inference is hosted through the direct OpenAI API. No local LLM
# or embedding model is loaded by the application. Every call incurs real
# OpenAI API cost -- there is no "free tier" route.

llm:
  # OPENAI_* environment variables (OPENAI_API_KEY, OPENAI_MODEL,
  # OPENAI_BASE_URL) override these non-secret values.
  provider_name: "OpenAI"
  # base_url is left unset so the SDK talks to https://api.openai.com/v1.
  # Set OPENAI_BASE_URL to point at an Azure/OpenAI-compatible proxy instead.
  require_api_key: true
  # CONFIRM EXACT MODEL IDS AT BUILD TIME -- placeholder names only.
  model: "gpt-5.1-mini"
  models:
    - name: "gpt-5.1-mini"
      priority: 1
      capabilities: ["fast"]
    - name: "gpt-5.1"
      priority: 2
      capabilities: ["reasoning", "quant", "research"]
  selection_strategy: "priority"
  role_models:
    planner: "gpt-5.1-mini"
    research: "gpt-5.1"
    quant: "gpt-5.1"
    model: "gpt-5.1"
    risk: "gpt-5.1-mini"
    trader: "gpt-5.1-mini"
    writer: "gpt-5.1-mini"
    narrator: "gpt-5.1-mini"
    credit_validator: "gpt-5.1"
    noncredit_validator: "gpt-5.1"
    model_validator: "gpt-5.1"
    report_writer: "gpt-5.1-mini"
  temperature: 0.2
  timeout_s: 240
  fallback_timeout_s: 90
  max_output_tokens: 4096

rag:
  db_path: "./kb/chroma"
  # Separate collection avoids dimension conflicts with older embedding indexes
  # (switching embedding providers/models changes vector dimensionality).
  collection: "openai-embed-v1"
  # CONFIRM EXACT MODEL ID AT BUILD TIME -- placeholder name only.
  embedding_model: "text-embedding-3-large"
  chunk_tokens: 256
  chunk_overlap: 32
  alpha_dense: 0.6          # hybrid weight: dense vs BM25
  top_k: 6
  top_m: 30                 # candidates before rerank fusion
  token_budget: 3500        # packed context budget for the LLM
  query_expansion:
    enabled: true
    method: "llm_then_rules"    # hosted LLM first, then deterministic synonyms
    max_expansions: 3
  reranking:
    enabled: false
    model: "none"
    top_k_before_rerank: 50
    top_k_after_rerank: 6
  # Metadata filtering (optional): pass to retrieve() as dict:
  # metadata_filters: {
  #   "kind": "doc" | "bib",           # document type
  #   "year_min": "2020",              # oldest year (inclusive)
  #   "year_max": "2024",              # newest year (inclusive)
  #   "source": "filename.pdf"         # specific source file
  # }
  # Example: retrieve(query, metadata_filters={"year_min": "2020"})

agent:
  max_iterations: 2         # critic revision loop cap
  sandbox_timeout_s: 60
  sandbox_mem_mb: 2048

trading:
  # All execution is PAPER by default. Live trading requires
  # ALLOW_LIVE=1 in the environment AND a manual confirm prompt.
  broker: "paper"
  initial_equity: 100000.0
  max_leverage: 1.0
  max_position_pct: 0.20
  max_turnover_per_rebalance: 0.50
  var_confidence: 0.99
  var_limit_pct: 0.05       # max 1-day 99% VaR as fraction of equity
  kelly_fraction: 0.33      # fractional Kelly (haircut on f*)

ibkr:
  # Orders are rejected unless the account is a paper account (normally DU*)
  # and an explicit approval token is presented. Set IBKR_ACCOUNT in the env.
  enabled: false
  host: "127.0.0.1"
  port: 7497
  client_id: 71
  paper_only: true
  transmit: false
  require_approval: true
  max_order_notional: 10000.0
  max_daily_notional: 25000.0
  allowed_order_types: ["LMT"]

quant_team:
  model_risk:
    min_sharpe: 0.0
    min_deflated_sharpe: 0.50
    max_drawdown: 0.25
    max_var_99: 0.05

risk_validation:
  # Bank Risk Validation Department agent team (credit / non-credit / model
  # risk). DRAFT/SUPPORT TOOL ONLY -- see agents/risk_schemas.py's module
  # docstring. All thresholds below are illustrative placeholders and must be
  # replaced with the bank's actual validation-policy-owned limits before any
  # real use.
  credit_risk:
    max_psi: 0.25
    min_gini: 0.40
    max_backtesting_exception_rate: 0.05   # exceptions / observations
    max_override_rate_pct: 0.10
  non_credit_risk:
    market:
      max_var_backtesting_exceptions_250d: 4       # Basel traffic-light green/yellow boundary, illustrative
      max_var_backtesting_exceptions_red_250d: 9
    operational:
      material_loss_threshold_amount: 100000
    liquidity:
      min_lcr_pct: 100.0
      min_nsfr_pct: 100.0
  model_risk:
    max_psi: 0.25
    min_gini: 0.40
    tier_1_revalidation_days: 365
    tier_2_revalidation_days: 730
    tier_3_revalidation_days: 1095
  approval_token_ttl_s: 1800   # sign-off tokens live 30 min
  pdf_via: "libreoffice"       # "libreoffice" | "docx2pdf" | "latex"

regulatory_rag:
  # Separate collection from the quant corpus so the two domains don't
  # pollute each other's retrieval.
  collection: "regulatory-corpus-v1"
  corpus_dir: "data/regulatory"

writing:
  latex_engine: "pdflatex"  # or "pdflatex"; tectonic is a single binary
  citation_sim_threshold: 0.55  # min cosine sim to support a cited claim

research:
  # Staged research pipeline (--research flag or /research-task endpoint)
  n_papers: 8               # arXiv papers to acquire per topic
  kg_enabled: true          # update knowledge graph after each run
  skip_known_papers: true   # skip papers already in the literature registry
  citation_dag_hops: 2      # max citation graph traversal depth
  # arXiv categories auto-detected from keywords:
  #   ML/DL  -> cs.LG, cs.AI, stat.ML, stat.AP, math.ST
  #   Finance -> q-fin, q-fin.PM, stat.ML, math.ST
  #   Both   -> all categories above

autonomous_loop:
  n_iterations: 3           # max iterations in autonomous research loop
  n_papers_per_iter: 6      # papers searched per loop iteration
  quality_threshold: 0.40   # target mean retrieval score before stopping

memory:
  compression_threshold: 20 # compress when task message count exceeds this
  keep_last: 8              # always retain N most-recent messages
  kb_expansion_threshold: 0.25  # mean score below which auto KB expansion fires

data:
  # Free FRED API key: https://fred.stlouisfed.org/docs/api/api_key.html
  # Leave empty to use the public CSV fallback (slower but still works).
  fred_api_key: ""
  # OpenAlex polite pool — provide your email for higher rate limits.
  # https://docs.openalex.org/how-to-use-the-api/rate-limits-and-authentication
  openalex_email: ""
