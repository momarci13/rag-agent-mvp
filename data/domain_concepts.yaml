# Domain Concept Hierarchy
# Maps informal/sloppy terms to canonical forms and related concepts
# Used by tiered_retrieval.py for fallback expansion when primary queries fail

finance:
  risk_metrics:
    volatility:
      canonical: "volatility"
      synonyms: [vol, variance, std_dev, standard_deviation, dispersion, fluctuation, downside_risk]
      related: [sharpe_ratio, sortino_ratio, maximum_drawdown, beta, var]

    sharpe_ratio:
      canonical: "Sharpe ratio"
      synonyms: [sharpe, risk_adjusted_return, returns_per_unit_risk, risk_adjusted_performance]
      related: [sortino_ratio, calmar_ratio, information_ratio, treynor_ratio]

    drawdown:
      canonical: "drawdown"
      synonyms: [max_drawdown, maximum_drawdown, mdd, peak_to_trough, decline]
      related: [volatility, underwater_plot, recovery_time]

    beta:
      canonical: "beta"
      synonyms: [market_beta, systematic_risk, market_sensitivity, correlation_to_market]
      related: [alpha, capm, risk_free_rate, market_premium]

  trading_concepts:
    momentum:
      canonical: "momentum"
      synonyms: [trend_following, momentum_strategy, trend_strength, price_momentum, trend, runup]
      related: [mean_reversion, carry, reversal, autocorrelation]

    mean_reversion:
      canonical: "mean reversion"
      synonyms: [mean_reverting, reversion_to_mean, statistical_arbitrage, pairs_trading, cointegration]
      related: [momentum, volatility, correlation, spread_trading]

    carry:
      canonical: "carry trade"
      synonyms: [carry, yield_harvest, interest_rate_differential, roll_yield, basis]
      related: [momentum, value, term_structure]

    value:
      canonical: "value investing"
      synonyms: [value, value_factor, mean_reversion_value, fundamental_value, undervaluation]
      related: [growth, quality, dividend_yield, price_to_book]

  market_structures:
    volatility_smile:
      canonical: "volatility smile"
      synonyms: [smile, volatility_curve, vol_surface, term_structure_volatility]
      related: [implied_volatility, skew, kurtosis, option_pricing]

    term_structure:
      canonical: "term structure"
      synonyms: [yield_curve, forward_curve, contango, backwardation, futures_curve]
      related: [basis, roll_yield, carry]

    correlation:
      canonical: "correlation"
      synonyms: [covariance, correlation_coefficient, rho, dependence, co_movement]
      related: [diversification, hedge_ratio, portfolio_optimization]

  assets:
    equity:
      canonical: "equity"
      synonyms: [stock, equity_market, equities, share, common_stock]
      related: [indices, sectors, dividend, earnings]

    fixed_income:
      canonical: "fixed income"
      synonyms: [bonds, bond_market, debt, credit, treasury]
      related: [yield_curve, credit_spread, duration, convexity]

    crypto:
      canonical: "cryptocurrency"
      synonyms: [crypto, digital_currency, blockchain, bitcoin, ethereum, altcoin, defi, nft]
      related: [blockchain, smart_contracts, distributed_ledger]

    commodities:
      canonical: "commodities"
      synonyms: [commodity, commodity_market, raw_materials, futures, energy, metals, agriculture]
      related: [term_structure, storage_costs, seasonality]

    derivatives:
      canonical: "derivatives"
      synonyms: [options, futures, forwards, swaps, structured_products]
      related: [implied_volatility, greeks, hedging, leverage]

statistics:
  distributions:
    normal:
      canonical: "normal distribution"
      synonyms: [gaussian, normal, bell_curve, standard_distribution]
      related: [t_distribution, chi_square, fat_tails, skew, kurtosis]

    fat_tails:
      canonical: "fat tails"
      synonyms: [heavy_tails, tail_risk, extreme_events, outliers, leptokurtic]
      related: [kurtosis, skewness, value_at_risk, expected_shortfall]

  hypothesis_testing:
    hypothesis_test:
      canonical: "hypothesis testing"
      synonyms: [statistical_test, significance_test, p_value, t_test, z_test]
      related: [confidence_interval, type_i_error, type_ii_error, power]

    regression:
      canonical: "regression"
      synonyms: [linear_regression, ols, ordinary_least_squares, curve_fitting, predictive_model]
      related: [r_squared, residuals, heteroskedasticity, multicollinearity]

    correlation:
      canonical: "correlation"
      synonyms: [correlation_coefficient, pearson_correlation, spearman_correlation, dependence]
      related: [covariance, autocorrelation, partial_correlation]

