      related: [feature_importance, splitting_criterion, leaf_node]

    ensemble:
      canonical: "ensemble method"
      synonyms: [ensemble, bagging, boosting, stacking, voting, blending]
      related: [weak_learner, bias_variance, out_of_bag]

  training:
    overfitting:
      canonical: "overfitting"
      synonyms: [overfit, memorization, high_variance, model_complexity]
      related: [regularization, cross_validation, dropout, early_stopping]

    validation:
      canonical: "cross validation"
      synonyms: [cross_validation, cv, k_fold, walk_forward_validation, backtesting]
      related: [train_test_split, hyperparameter_tuning, grid_search]

writing:
  document_types:
    paper:
      canonical: "research paper"
      synonyms: [paper, research, academic, publication, preprint, journal, conference]
      related: [abstract, introduction, literature_review, methodology, results, conclusion]

    report:
      canonical: "report"
      synonyms: [report, analysis, findings, white_paper, technical_documentation]
      related: [executive_summary, appendix, references, tables, figures]

  methodologies:
    literature_review:
      canonical: "literature review"
      synonyms: [literature_review, survey, systematic_review, meta_analysis, systematic_literature_review]
      related: [abstract, methodology, synthesis, research_gap]

    case_study:
      canonical: "case study"
      synonyms: [case_study, case_analysis, empirical_analysis, application, real_world_example]
      related: [background, methodology, findings, implications]

general:
  analysis:
    comparison:
      canonical: "comparative analysis"
      synonyms: [comparison, comparative, vs, versus, relative, difference]
      related: [benchmark, baseline, counterfactual]

    explanation:
      canonical: "explanation"
      synonyms: [explain, why, mechanism, how, interpretation, causality]
      related: [interpretation, intuition, narrative, mechanism]

    optimization:
      canonical: "optimization"
      synonyms: [optimize, optimization, tuning, best, efficient, maximize]
      related: [constraint, objective, parameter, sensitivity]

  methodologies:
    monte_carlo:
      canonical: "Monte Carlo simulation"
      synonyms: [monte_carlo, monte_carlo_simulation, simulation, mcs, stochastic_simulation]
      related: [random_sampling, variance_reduction, bootstrap]

    bayesian:
      canonical: "Bayesian analysis"
      synonyms: [bayesian, bayes, posterior, prior, belief_updating, probabilistic]
      related: [likelihood, evidence, inference, markov_chain_monte_carlo]

common_aliases:
  # For very common misspellings or super informal terms
  risk: [volatility, uncertainty, downside_risk]
  returns: [performance, profitability, pnl, profit]
  data: [dataset, timeseries, historical_data, information]
  model: [strategy, algorithm, system, approach]
  prediction: [forecast, projection, estimate, prediction]
  trend: [momentum, direction, pattern, movement]
  pattern: [signal, anomaly, behavior, regime]
