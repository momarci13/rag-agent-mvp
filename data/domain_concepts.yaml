  data_types:
    time_series:
      canonical: "time series"
      synonyms: [timeseries, temporal_data, sequential_data, historical_data, intraday, daily, weekly]
      related: [stationarity, autocorrelation, arima, exponential_smoothing]

    high_frequency:
      canonical: "high frequency"
      synonyms: [hft, tick_data, microsecond, intraday, real_time_data, streaming]
      related: [latency, throughput, market_impact, microstructure]

    panel:
      canonical: "panel data"
      synonyms: [panel, cross_section, longitudinal, balanced_panel, unbalanced_panel]
      related: [fixed_effects, random_effects, within_estimator]

  transformations:
    rolling_window:
      canonical: "rolling window"
      synonyms: [rolling, moving_average, sliding_window, window_function, lookback]
      related: [lag, shift, cumulative]

    standardization:
      canonical: "standardization"
      synonyms: [normalization, z_score, standardize, scaling, unit_variance]
      related: [mean_centering, log_transform, winsorization]

