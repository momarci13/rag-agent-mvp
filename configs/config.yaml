# Model Development & Validation Studio configuration
# ---------------------------------------------------------------
# Two agents: the Modeler (designs, codes, tests and documents a model) and
# the Validator (replicates, reviews, tests independently and reports).
# All inference goes through the OpenAI API; every call is billed.
# Secrets (OPENAI_API_KEY, STUDIO_API_TOKEN) come from the environment only.

llm:
  # OPENAI_* environment variables (OPENAI_API_KEY, OPENAI_MODEL,
  # OPENAI_BASE_URL) override these non-secret values.
  provider_name: "OpenAI"
  # base_url is left unset so the SDK talks to https://api.openai.com/v1.
  # Set OPENAI_BASE_URL to point at an Azure/OpenAI-compatible proxy instead.
  require_api_key: true
  # CONFIRM EXACT MODEL IDS AT BUILD TIME -- placeholder names only.
  model: "gpt-5.1-mini"
  models:
    - name: "gpt-5.1-mini"
      priority: 1
      capabilities: ["fast"]
    - name: "gpt-5.1"
      priority: 2
      capabilities: ["reasoning", "quant", "research"]
  selection_strategy: "priority"
  role_models:
    modeler: "gpt-5.1"
    validator: "gpt-5.1"
  temperature: 0.2
  timeout_s: 240
  fallback_timeout_s: 90
  max_output_tokens: 16000

rag:
  db_path: "./kb/chroma"
  # Separate collection avoids dimension conflicts with older embedding indexes
  # (switching embedding providers/models changes vector dimensionality).
  collection: "openai-embed-v1"
  # CONFIRM EXACT MODEL ID AT BUILD TIME -- placeholder name only.
  embedding_model: "text-embedding-3-large"
  chunk_tokens: 256
  chunk_overlap: 32
  alpha_dense: 0.6          # hybrid weight: dense vs BM25
  top_k: 6
  top_m: 30                 # candidates before rerank fusion
  token_budget: 3500        # packed context budget for the LLM
  query_expansion:
    enabled: true
    method: "llm_then_rules"    # hosted LLM first, then deterministic synonyms
    max_expansions: 3
  reranking:
    enabled: false
    model: "none"
    top_k_before_rerank: 50
    top_k_after_rerank: 6
  # Metadata filtering (optional): pass to retrieve() as dict:
  # metadata_filters: {
  #   "kind": "doc" | "bib",           # document type
  #   "year_min": "2020",              # oldest year (inclusive)
  #   "year_max": "2024",              # newest year (inclusive)
  #   "source": "filename.pdf"         # specific source file
  # }
  # Example: retrieve(query, metadata_filters={"year_min": "2020"})

studio:
  output_dir: "output/studio"
  max_rounds: 3                 # Modeler/Validator remediation rounds before handing over to a human
  pipeline_timeout_s: 900       # wall clock for one run of the model pipeline
  test_timeout_s: 900           # wall clock for one pytest run
  sandbox_mem_mb: 4096          # memory cap for generated code (POSIX only)
  max_repair_attempts: 2        # automatic fixes of crashing code per step
  replication_rel_tol: 1.0e-6   # reported vs replicated metrics (develop mode)
  replication_abs_tol: 1.0e-9
  challenger_material_gap: 0.02 # relative gap on the primary metric that counts as "challenger better"
  pdf_via: "libreoffice"        # "libreoffice" | "docx2pdf" (Windows + Word)
  data_sample_rows: 5           # sample rows shown to the LLM in the data profile
  library_collection: "studio-library-v1"
  builtin_corpus_dir: "data/regulatory"

risk_validation:
  # Bank Risk Validation Department agent team (credit / non-credit / model
  # risk). DRAFT/SUPPORT TOOL ONLY -- see agents/risk_schemas.py's module
  # docstring. All thresholds below are illustrative placeholders and must be
  # replaced with the bank's actual validation-policy-owned limits before any
  # real use.
  credit_risk:
    max_psi: 0.25
    min_gini: 0.40
    max_backtesting_exception_rate: 0.05   # exceptions / observations; fallback when observations < 30
    pd_calibration_significance: 0.05      # Jeffreys / binomial PD calibration p-value cutoff (EBA/GL/2017/16)
    lgd_backtesting_significance: 0.05     # one-sided t-test p-value cutoff (used only when a sample std is available)
    lgd_backtesting_tolerance: 0.10        # absolute LGD/CCF mean gap tolerated (the default path when no sample std)
    min_moc_pct: 0.0                       # min documented Margin of Conservatism when data deficiencies exist
    min_data_completeness_pct: 95.0        # EBA/GL/2017/16 + BCBS 239 data-quality floor
    min_data_accuracy_pct: 98.0
    min_observation_period_years: 5        # CRR minimum historical observation period
    revalidation_days: 365                # max age of the last credit-model validation before it is overdue
    revalidation_warning_days: 60          # raise a low-severity finding this many days before due
    max_override_rate_pct: 0.10
    max_single_name_concentration_pct: 5.0
    # Per-jurisdiction overrides (merged on top of the block above via
    # ValidationThresholds.resolve()). Only list the fields that differ.
    jurisdictions:
      HU:
        max_psi: 0.20                       # illustrative: stricter national-discretion example
        min_observation_period_years: 7     # illustrative MNB national-discretion add-on
  non_credit_risk:
    market:
      max_var_backtesting_exceptions_250d: 4       # Basel traffic-light green/yellow boundary, illustrative
      max_var_backtesting_exceptions_red_250d: 9
      kupiec_significance_level: 0.05              # p-value threshold for the Kupiec POF test
      es_confidence_level: 0.975                   # FRTB replaces VaR with Expected Shortfall at 97.5%
      require_expected_shortfall: true            # flag when ES is not reported alongside VaR
      backtesting_confidence_levels: [0.99, 0.975] # run the traffic-light/Kupiec check at each level supplied
      pla_spearman_green: 0.80                     # FRTB P&L-attribution green zone (BCBS d457)
      pla_spearman_amber: 0.70
      pla_ks_green: 0.09
      pla_ks_amber: 0.12
    operational:
      material_loss_threshold_amount: 100000
    liquidity:
      min_lcr_pct: 100.0
      min_nsfr_pct: 100.0
      max_funding_concentration_pct: 25.0
  model_risk:
    max_psi: 0.25
    min_gini: 0.40
    tier_1_revalidation_days: 365
    tier_2_revalidation_days: 730
    tier_3_revalidation_days: 1095
    revalidation_warning_days: 60
    # Per-tier overrides (merged on top of the block above). Tier 1 (high
    # materiality) is illustratively stricter than the flat defaults.
    tiers:
      tier_1_high_materiality:
        max_psi: 0.15
        min_gini: 0.45
        required_signoffs: 2   # four-eyes sign-off for high-materiality models
  required_signoffs: 1          # raise to 2+ for four-eyes sign-off
  require_distinct_signoffs: true   # duplicate sign-offs by the same person do not count toward the threshold
  # Severity -> remediation deadline (days) applied to any finding without an
  # explicit remediation_deadline_days. Illustrative -- replace with the bank's
  # findings-management policy.
  remediation_deadlines:
    critical: 30
    high: 90
    medium: 180
    low: 365
  evidence_overlap_min_ratio: 0.15   # below this, a finding's evidence is flagged evidence_grounded=false
